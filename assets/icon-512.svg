<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e0e7ff" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background Rounded Rect -->
  <rect width="512" height="512" rx="128" fill="url(#grad)" />
  <rect width="504" height="504" x="4" y="4" rx="124" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="4" />
  
  <!-- Headphones / Audio & Soundwave Motif -->
  <g transform="translate(106, 110)" filter="url(#glow)">
    <!-- Headphones Arc -->
    <path d="M 30 160 C 30 50, 270 50, 270 160" fill="none" stroke="#ffffff" stroke-width="24" stroke-linecap="round" />
    <!-- Sound Waves Inside -->
    <rect x="80" y="130" width="16" height="60" rx="8" fill="url(#waveGrad)" />
    <rect x="110" y="100" width="16" height="120" rx="8" fill="url(#waveGrad)" />
    <rect x="140" y="80" width="16" height="160" rx="8" fill="url(#waveGrad)" />
    <rect x="170" y="110" width="16" height="100" rx="8" fill="url(#waveGrad)" />
    <rect x="200" y="140" width="16" height="40" rx="8" fill="url(#waveGrad)" />
    
    <!-- Earcups -->
    <rect x="16" y="150" width="28" height="64" rx="14" fill="#ffffff" />
    <rect x="256" y="150" width="28" height="64" rx="14" fill="#ffffff" />
    
    <!-- Pen / Dictation Icon bottom-right -->
    <circle cx="240" cy="240" r="44" fill="#10b981" stroke="#ffffff" stroke-width="8"/>
    <path d="M 226 254 L 244 226 L 254 236 L 236 264 Z" fill="#ffffff"/>
    <polygon points="224,256 222,266 232,264" fill="#ffffff"/>
  </g>
</svg>
